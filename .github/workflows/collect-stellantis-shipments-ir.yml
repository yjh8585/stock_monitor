name: Stellantis 북미 출하 수집 — IR 홈페이지 (분기 estimated 릴리스)

on:
  schedule:
    # Stellantis IR 홈페이지의 분기 'Estimated Consolidated Shipments' 릴리스는 분기말 ~2주 뒤에
    # 나온다(실측: Q1 4월 중~말 · Q2 7월 중순 · Q3 10월 중~말). EDGAR 재무결과보다 먼저 나오고
    # 지역별 절대값 표를 실어 북미 분기값을 직접 준다(is_derived=false).
    # 릴리스가 그 달 어디에 떨어져도 잡도록 16·22·28일 3회 시도(멱등 upsert).
    - cron: '0 4 16,22,28 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      year_from:
        description: '수집 시작 연도 (비우면 2026 — estimated 릴리스 시작 연도)'
        type: string
        default: '2026'
      year_to:
        description: '마지막 연도 (비우면 올해)'
        type: string
        default: ''
      dry_run:
        description: 'DB 쓰기 없이 파싱 결과만 확인'
        type: boolean
        default: false

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Python 3.13 설정
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # stellantis.com은 Akamai가 requests/curl을 403 차단 → 실브라우저(Playwright)로 우회.
      - name: Playwright 브라우저 설치 (chromium만)
        run: python -m playwright install --with-deps chromium

      - name: Stellantis IR 출하 수집
        run: |
          ARGS=""
          if [ -n "${{ inputs.year_from }}" ]; then
            ARGS="$ARGS --year-from ${{ inputs.year_from }}"
          fi
          if [ -n "${{ inputs.year_to }}" ]; then
            ARGS="$ARGS --year-to ${{ inputs.year_to }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python collect_stellantis_shipments_ir.py $ARGS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_REVALIDATE_URL: ${{ secrets.NEXT_REVALIDATE_URL }}
          NEXT_REVALIDATE_SECRET: ${{ secrets.NEXT_REVALIDATE_SECRET }}
