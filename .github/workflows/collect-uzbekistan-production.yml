name: collect-uzbekistan-production

# 우즈베키스탄 차종(모델)별 생산 (stat.uz 통계위 보도자료 news-of-committee).
# 모델별 생산량을 영문 평문으로 매월 발표(1~N월 누계) + 연말 만년 → cron 매월 28일 03:00 UTC.
# (구 collect_uzbekistan_production.py 산업 PDF 파서는 모델 데이터에선 대체됨)

on:
  schedule:
    - cron: '0 3 28 * *'
  workflow_dispatch:
    inputs:
      year_from:
        description: '백필 시작 연도 (default 2022)'
        type: string
        default: '2022'
      max_start:
        description: '목록 페이지네이션 최대 start (default 400)'
        type: string
        default: '400'

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r scripts/requirements.txt
      - name: Run collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          NEXT_REVALIDATE_URL: ${{ secrets.APP_BASE_URL }}/api/revalidate
          NEXT_REVALIDATE_SECRET: ${{ secrets.NEXT_REVALIDATE_SECRET }}
          # 인포그래픽(이미지) 기사 비전 추출용 (2024 이하·2025 일부). 없으면 텍스트 기사만.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/collect_uzbekistan_production_models.py \
            --year-from ${{ inputs.year_from || '2022' }} \
            --max-start ${{ inputs.max_start || '400' }}
