name: OEM 생산량 Excel 자동 동기화 (주 1회)

# 판매량(sync-oem-excel.yml)과 같은 MarkLines 계정·쿠키를 쓰지만 다운로드 페이지가 다르다
# (vehicle_sales vs vehicle_production). 두 파일은 레이아웃도 다르므로 스크립트를 분리했다.
#
# 판매 동기화보다 10분 늦게 돈다 — 같은 쿠키로 동시에 두 세션을 열면 MarkLines가 로그인을
# 무효화할 수 있어 순차로 겹치지 않게 띄운다.

on:
  schedule:
    - cron: '10 1 * * 1' # KST 월요일 10:10 (UTC 월요일 01:10)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.13 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: MarkLines 생산량 Excel 다운로드 + DB 동기화
        run: python scripts/sync_oem_production_excel.py
        env:
          MARKLINES_COOKIE: ${{ secrets.MARKLINES_COOKIE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_REVALIDATE_URL: ${{ secrets.NEXT_REVALIDATE_URL }}
          NEXT_REVALIDATE_SECRET: ${{ secrets.NEXT_REVALIDATE_SECRET }}
