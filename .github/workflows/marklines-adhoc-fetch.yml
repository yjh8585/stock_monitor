name: MarkLines 임시 조사 (수동 전용)

# 왜 있나
#   유효한 MarkLines 로그인 쿠키가 이 레포의 Secrets 에만 있고 값은 꺼낼 수 없다
#   (Secrets = write-only · 로컬 추출은 Chrome ABE·CDP 차단으로 전부 막혔다).
#   그래서 쿠키를 꺼내는 대신 **여기서 받아 artifact 로 내려보낸다.**
#
# 안전장치
#   · 트리거는 workflow_dispatch **뿐** — 스케줄이 없어 저절로 돌지 않는다.
#   · DB 를 건드리지 않는다(읽기만). 기존 OEM 동기화 워크플로와 완전히 분리돼 있어
#     이 파일을 남겨 둬도 부작용이 없다 → **작업 후 원복 불필요.**
#
# 쓰는 법
#   gh workflow run marklines-adhoc-fetch.yml
#   gh run download <run-id> -n marklines-raw

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Python 3.13 설정
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: MarkLines 페이지 수집 (표준 라이브러리만 사용)
        run: python scripts/fetch_marklines_adhoc.py
        env:
          MARKLINES_COOKIE: ${{ secrets.MARKLINES_COOKIE }}

      - name: 결과 업로드
        # 수집이 실패해도 진단용으로 올린다(빈껍데기 HTML 도 원인 파악에 쓸모가 있다)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: marklines-raw
          path: out/
          retention-days: 7
