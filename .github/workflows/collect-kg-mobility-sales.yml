name: KG모빌리티 차종별 판매 수집 (매월)

on:
  schedule:
    # 매월 15일 03:00 UTC = KST 12:00. KG IR 자료는 통상 월 초~중순에 전월 데이터 갱신.
    - cron: '0 3 15 * *'
  workflow_dispatch:
    inputs:
      year_from:
        description: 'backfill 시작 연도'
        type: string
        default: '2021'
      year_to:
        description: 'backfill 마지막 연도 (비우면 올해)'
        type: string
        default: ''
      reprocess_all:
        description: '모든 연도 강제 재처리 (cache 무시)'
        type: boolean
        default: false

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Python 3.13 설정
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: Playwright 브라우저 설치 (chromium만)
        run: python -m playwright install --with-deps chromium

      - name: KG모빌리티 판매 수집
        run: |
          ARGS=""
          if [ -n "${{ inputs.year_from }}" ]; then
            ARGS="$ARGS --year-from ${{ inputs.year_from }}"
          fi
          if [ -n "${{ inputs.year_to }}" ]; then
            ARGS="$ARGS --year-to ${{ inputs.year_to }}"
          fi
          if [ "${{ inputs.reprocess_all }}" = "true" ]; then
            ARGS="$ARGS --reprocess-all"
          fi
          python collect_kg_mobility_sales.py $ARGS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_REVALIDATE_URL: ${{ secrets.NEXT_REVALIDATE_URL }}
          NEXT_REVALIDATE_SECRET: ${{ secrets.NEXT_REVALIDATE_SECRET }}
