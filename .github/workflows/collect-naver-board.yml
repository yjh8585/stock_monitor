name: 네이버 종목토론 수집 (한세)

# Vercel /api/cron/naver-board가 Hobby plan 60s 한계로 504 — GHA runner에서 Node 직접 실행으로 전환.
# 기존 cron-naver-board.yml(curl 호출)을 대체.
on:
  schedule:
    - cron: '*/30 0-6 * * 1-5' # 평일 KST 09:00~15:30 (UTC 0~6시) 30분마다
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Node 24 설정
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 네이버 종목토론 수집
        run: |
          # 일시적 PostgREST 5xx 등 transient 오류 대비 재시도 (멱등 수집기)
          attempt=1; max=3
          until npx tsx scripts/collect_naver_board.ts; do
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::collect_naver_board $max회 모두 실패"; exit 1
            fi
            echo "::warning::collect_naver_board 시도 $attempt/$max 실패 — $((attempt*30))s 후 재시도"
            sleep $((attempt*30)); attempt=$((attempt+1))
          done
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_REVALIDATE_URL: ${{ secrets.NEXT_REVALIDATE_URL }}
          NEXT_REVALIDATE_SECRET: ${{ secrets.NEXT_REVALIDATE_SECRET }}
