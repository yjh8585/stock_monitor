name: OEM 중국 Excel 자동 동기화 (주 1회)

# /oem/china 탭 — MarkLines 중국 전용 엑셀 3종(Displacement/NEV · Export Volume · Passenger Cars).
# 생산량 동기화(sync-oem-production-excel.yml)보다 10분 늦게 돈다 — 같은 쿠키로 두 세션을 동시에 열면
# MarkLines 가 로그인을 무효화할 수 있어 겹치지 않게 띄운다.
#
# 「바뀐 파일만 적재」(계획서 결정 4)는 지난 회차 파일과 견줘서 판정하는데(md5 · 승용차는 읽은 행), 러너는
# 매번 빈 상태로 뜨므로 지난 파일을 actions/cache 로 이어받는다. 캐시가 비면(7일 미접근 퇴출 등) 전체 적재로
# 돌아갈 뿐 결과는 같다. 파서 규칙만 고쳤을 때 다시 적재하려면 이 캐시를 지우고 수동 실행한다.
# 경위·결정 = docs/plans/2026-10-29-oem-china-tab.md

on:
  schedule:
    - cron: '20 1 * * 1' # KST 월요일 10:20 (UTC 월요일 01:20)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Python 3.13 설정
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: 지난 회차 엑셀 복원 (변경 감지용)
        uses: actions/cache@v4
        with:
          path: 참고/oem 중국
          key: oem-china-excel-${{ github.run_id }}
          restore-keys: oem-china-excel-

      - name: MarkLines 중국 Excel 다운로드 + DB 동기화
        run: python scripts/sync_oem_china_excel.py
        env:
          MARKLINES_COOKIE: ${{ secrets.MARKLINES_COOKIE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_REVALIDATE_URL: ${{ secrets.NEXT_REVALIDATE_URL }}
          NEXT_REVALIDATE_SECRET: ${{ secrets.NEXT_REVALIDATE_SECRET }}
