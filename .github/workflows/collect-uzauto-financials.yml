name: UzAuto IFRS PDF 재무 수집 (주 1회)

on:
  schedule:
    # 매주 월요일 03:00 UTC = KST 12:00. Anthropic Opus PDF input — 첫 실행 후 cache hit이면 호출 0.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      reprocess_all:
        description: '모든 PDF 강제 재처리 (cache 무시)'
        type: boolean
        default: false

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.13 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: UzAuto IFRS PDF 재무 수집
        run: |
          if [ "${{ inputs.reprocess_all }}" = "true" ]; then
            python collect_uzauto_financials.py --reprocess-all
          else
            python collect_uzauto_financials.py
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_REVALIDATE_URL: ${{ secrets.NEXT_REVALIDATE_URL }}
          NEXT_REVALIDATE_SECRET: ${{ secrets.NEXT_REVALIDATE_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
