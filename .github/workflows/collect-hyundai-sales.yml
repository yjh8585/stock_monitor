name: 현대차 차종별 판매 수집 (매월)

on:
  schedule:
    # 매월 15일 03:00 UTC = KST 12:00. 현대 IR은 통상 월 초~중순에 전월 데이터 갱신.
    - cron: '0 3 15 * *'
  workflow_dispatch:
    inputs:
      year_from:
        description: 'backfill 시작 연도'
        type: string
        default: '2021'
      year_to:
        description: 'backfill 마지막 연도 (비우면 올해)'
        type: string
        default: ''
      kind:
        description: '수집 종류 (model/factory/export/all)'
        type: choice
        options: [all, model, factory, export]
        default: all
      reprocess_all:
        description: '모든 연도 강제 재처리'
        type: boolean
        default: false

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.13 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: Playwright 브라우저 설치 (chromium만)
        run: python -m playwright install --with-deps chromium

      - name: 현대차 판매 수집
        run: |
          ARGS=""
          if [ -n "${{ inputs.year_from }}" ]; then
            ARGS="$ARGS --year-from ${{ inputs.year_from }}"
          fi
          if [ -n "${{ inputs.year_to }}" ]; then
            ARGS="$ARGS --year-to ${{ inputs.year_to }}"
          fi
          if [ -n "${{ inputs.kind }}" ] && [ "${{ inputs.kind }}" != "all" ]; then
            ARGS="$ARGS --kind ${{ inputs.kind }}"
          fi
          if [ "${{ inputs.reprocess_all }}" = "true" ]; then
            ARGS="$ARGS --reprocess-all"
          fi
          python collect_hyundai_sales.py $ARGS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_REVALIDATE_URL: ${{ secrets.NEXT_REVALIDATE_URL }}
          NEXT_REVALIDATE_SECRET: ${{ secrets.NEXT_REVALIDATE_SECRET }}

      - name: 현대 IR 사이트 hover 지역별 도매 합계 수집 (hyundai_export_regions, source=ir-summary)
        # 분기 cron 추가 대신 같은 workflow에 step 추가 — 매월 sales 갱신과 동시에 IR summary도 갱신.
        # API 직접 POST이므로 Playwright 불필요. 실패해도 sales 수집 결과는 유지.
        if: ${{ inputs.kind == 'all' || inputs.kind == 'export' || github.event_name == 'schedule' }}
        continue-on-error: true
        run: |
          IR_ARGS=""
          if [ -n "${{ inputs.year_from }}" ]; then
            IR_ARGS="$IR_ARGS --year-from ${{ inputs.year_from }}"
          fi
          if [ -n "${{ inputs.year_to }}" ]; then
            IR_ARGS="$IR_ARGS --year-to ${{ inputs.year_to }}"
          fi
          python collect_hyundai_ir_summary.py $IR_ARGS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_REVALIDATE_URL: ${{ secrets.NEXT_REVALIDATE_URL }}
          NEXT_REVALIDATE_SECRET: ${{ secrets.NEXT_REVALIDATE_SECRET }}
