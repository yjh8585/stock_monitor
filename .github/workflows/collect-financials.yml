name: 분기·연간 실적 수집

on:
  schedule:
    # KST 1/4/7/10월 15일 06:00 (UTC 14일 21:00)
    # DART 보고서 제출 기한(Q1=5/15, H1=8/14, Q3=11/14, Annual=3/31) 이후
    - cron: '0 21 14 1,4,7,10 *'
  workflow_dispatch: # 수동 실행 허용

jobs:
  # 상장사 재무 (fnguide + yfinance) — DART 수집과 무관해 별도 job
  listed:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: scripts

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Python 3.13 설정
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-phase3.txt

      - name: 의존성 설치
        run: pip install -r requirements-phase3.txt

      # fnguide 신버전(wcomp)은 재무제표를 JSON 엔드포인트로 주므로 브라우저가 필요 없다
      # (2026-08 전환). Chromium 설치 단계를 제거해 매 실행 수 분을 아낀다.
      - name: 재무 데이터 수집 (상장사 — fnguide JSON + yfinance)
        run: python collect_financials.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_REVALIDATE_URL: ${{ secrets.NEXT_REVALIDATE_URL }}
          NEXT_REVALIDATE_SECRET: ${{ secrets.NEXT_REVALIDATE_SECRET }}
          VALLEY_EMAIL: ${{ secrets.VALLEY_EMAIL }}
          VALLEY_PASSWORD: ${{ secrets.VALLEY_PASSWORD }}

  # 비상장사 DART 수집 — SHARD 8-way 병렬로 분할 (회사당 ~150s 처리, 33개/shard 기준 82분 예상)
  dart-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    defaults:
      run:
        working-directory: scripts

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Python 3.13 설정
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-phase3.txt

      - name: 의존성 설치
        run: pip install -r requirements-phase3.txt

      - name: 비상장사 재무 데이터 수집 — shard ${{ matrix.shard }}/8
        run: python collect_dart_audit.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_REVALIDATE_URL: ${{ secrets.NEXT_REVALIDATE_URL }}
          NEXT_REVALIDATE_SECRET: ${{ secrets.NEXT_REVALIDATE_SECRET }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: '8'

  # 국내자동차(5사) DART 자동 갱신 — DART 호출하지만 회사 수 적어 단일 job
  domestic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: scripts

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Python 3.13 설정
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-phase3.txt

      - name: 의존성 설치
        run: pip install -r requirements-phase3.txt

      - name: 국내자동차(/domestic) DART 자동 갱신 + 외감 검증 + 재무 수집
        run: python collect_dart_domestic.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_REVALIDATE_URL: ${{ secrets.NEXT_REVALIDATE_URL }}
          NEXT_REVALIDATE_SECRET: ${{ secrets.NEXT_REVALIDATE_SECRET }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}

  # 국내 상장사 기업개요 — fnguide Snapshot
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: scripts

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Python 3.13 설정
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-phase3.txt

      - name: 의존성 설치
        run: pip install -r requirements-phase3.txt

      - name: Playwright Chromium 설치
        run: playwright install chromium --with-deps

      - name: 국내 상장사 기업개요(business_summary) 수집 — fnguide Snapshot
        run: python collect_kr_snapshot.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_REVALIDATE_URL: ${{ secrets.NEXT_REVALIDATE_URL }}
          NEXT_REVALIDATE_SECRET: ${{ secrets.NEXT_REVALIDATE_SECRET }}
