name: Cox 브랜드별 신차 재고일수 수집 (월 1회)

on:
  schedule:
    # 매월 20일 04:00 UTC = KST 13:00.
    # Cox는 전월 데이터를 매월 중순에 발표한다(실측 9개월 발행일: 11~18일) → 20일이면 여유.
    - cron: '0 4 20 * *'
  workflow_dispatch:
    inputs:
      months:
        description: '최근 N개월 처리 (소급 수정 재적재)'
        type: string
        default: '3'
      reprocess_all:
        description: 'sha256 캐시 무시하고 전부 LLM 재판독'
        type: boolean
        default: false

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Python 3.13 설정
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 캐시(data/_cox_inventory_cache)는 gitignore라 runner에 없다 → 판독한 달만큼 매번 LLM 호출.
      # 그래서 cron 기본값은 1개월(신규분만) — 3이면 이미 적재된 달까지 매월 다시 판독한다
      # (2026-08-06 비용 절감). 소급 수정 재적재는 workflow_dispatch에서 months=3으로 수동 실행.
      - name: Cox 브랜드 재고일수 수집
        run: |
          if [ "${{ inputs.reprocess_all }}" = "true" ]; then
            python collect_cox_inventory.py --months "${{ inputs.months || '3' }}" --reprocess-all
          else
            python collect_cox_inventory.py --months "${{ inputs.months || '1' }}"
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_REVALIDATE_URL: ${{ secrets.NEXT_REVALIDATE_URL }}
          NEXT_REVALIDATE_SECRET: ${{ secrets.NEXT_REVALIDATE_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
