name: Stellantis NA 분기 판매 수집 (분기 첫 달 3일)

on:
  schedule:
    # 분기 첫 달 3일 03:00 UTC = KST 12:00. (Q1=4월/Q2=7월/Q3=10월/Q4=다음해 1월).
    # FCA US LLC 분기 PR은 발표일 = 분기 첫 달 1~5일 ET (UTC+5).
    # Q4는 1월 3~5일 사이에 나오므로 같은 날 03:00 UTC면 안전 (보통 UTC 14시 이후 게시).
    - cron: '0 3 3 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      year_from:
        description: 'backfill 시작 연도'
        type: string
        default: '2021'
      year_to:
        description: 'backfill 마지막 연도 (비우면 올해)'
        type: string
        default: ''
      quarter:
        description: '특정 분기만 (1/2/3/4, 비우면 전체)'
        type: choice
        options: ['', '1', '2', '3', '4']
        default: ''
      reprocess_all:
        description: 'HTML sha256 캐시 무시하고 강제 재처리'
        type: boolean
        default: false
      auto_discover:
        description: 'publisher index에서 신규 분기 PR 자동 발견 + cache 갱신'
        type: boolean
        default: false

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.13 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # Playwright/브라우저 불필요. requests + BeautifulSoup만 사용.
      - name: Stellantis NA 판매 수집
        run: |
          ARGS=""
          if [ -n "${{ inputs.year_from }}" ]; then
            ARGS="$ARGS --year-from ${{ inputs.year_from }}"
          fi
          if [ -n "${{ inputs.year_to }}" ]; then
            ARGS="$ARGS --year-to ${{ inputs.year_to }}"
          fi
          if [ -n "${{ inputs.quarter }}" ]; then
            ARGS="$ARGS --quarter ${{ inputs.quarter }}"
          fi
          if [ "${{ inputs.reprocess_all }}" = "true" ]; then
            ARGS="$ARGS --reprocess-all"
          fi
          if [ "${{ inputs.auto_discover }}" = "true" ]; then
            ARGS="$ARGS --auto-discover"
          fi
          python collect_stellantis_na_sales.py $ARGS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_REVALIDATE_URL: ${{ secrets.NEXT_REVALIDATE_URL }}
          NEXT_REVALIDATE_SECRET: ${{ secrets.NEXT_REVALIDATE_SECRET }}
