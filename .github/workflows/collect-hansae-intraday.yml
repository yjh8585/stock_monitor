name: 한세 장중 시세·수급 (5분 간격)

on:
  schedule:
    # 평일 KST 09:00~15:35 = UTC 00:00~06:35, 5분 간격 (장중 분봉 + 잠정 수급)
    - cron: '*/5 0-6 * * 1-5'
    # 평일 KST 18:30 = UTC 09:30 (장 마감 후 일별 수급 확정값 재수집)
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.13 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 장중 분 단위 시세 수집 (네이버, 오늘)
        if: github.event.schedule == '*/5 0-6 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: python collect_naver_intraday.py --mode today
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 장중 잠정 수급 수집 (KRX, 오늘)
        # 시세 수집 실패에 발이 묶이지 않도록 if: always() + 장중 cron 전용
        if: always() && (github.event.schedule == '*/5 0-6 * * 1-5' || github.event_name == 'workflow_dispatch')
        run: python collect_supply_demand.py --mode intraday
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}

      - name: 장마감 후 일별 수급 확정값 수집 (incremental)
        # KRX는 장 마감 후 publish되므로 KST 18:30 cron에서 한 번만 도는 게 안전
        if: github.event.schedule == '30 9 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: python collect_supply_demand.py --mode incremental
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
