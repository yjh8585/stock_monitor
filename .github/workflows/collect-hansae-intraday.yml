name: 한세 장중 시세·수급 (5분 간격)

on:
  schedule:
    # 평일 KST 09:00~15:35 = UTC 00:00~06:35, 5분 간격 (장중 분봉 + 잠정 수급)
    - cron: '*/5 0-6 * * 1-5'
    # 평일 KST 18:30 = UTC 09:30 (장 마감 후 일별 수급 확정값 재수집)
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_BASE_URL: https://openapi.koreainvestment.com:9443
      KIS_ENV: prod

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.13 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 장중 분봉: KIS 우선 (공식 API)
      - name: 장중 분 단위 시세 수집 (KIS, 오늘)
        id: kis_intraday
        if: github.event.schedule == '*/5 0-6 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: python collect_kis_intraday.py --mode today

      # KIS 분봉 실패 시 네이버 fallback (대시보드 단절 방지)
      - name: 장중 분 단위 시세 수집 (네이버 fallback)
        if: |
          steps.kis_intraday.conclusion == 'failure' &&
          (github.event.schedule == '*/5 0-6 * * 1-5' || github.event_name == 'workflow_dispatch')
        run: python collect_naver_intraday.py --mode today

      # 장중 수급: KIS 잠정 누적 (HHPTJ04160200)
      # pykrx는 현재 KRX 응답 변경으로 'Length mismatch' 에러 발생 — 사용 보류
      - name: 장중 잠정 수급 수집 (KIS, 오늘)
        if: always() && (github.event.schedule == '*/5 0-6 * * 1-5' || github.event_name == 'workflow_dispatch')
        run: python collect_kis_supply.py --mode intraday

      # 장 마감 후 일별 수급 확정값 — KIS 1차
      - name: 장마감 후 일별 수급 확정값 수집 (KIS, incremental)
        id: kis_incremental
        if: github.event.schedule == '30 9 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: python collect_kis_supply.py --mode incremental

      # KIS incremental 실패 시 pykrx fallback (pykrx가 회복됐을 때를 위해 유지)
      - name: 장마감 후 일별 수급 확정값 수집 (pykrx fallback)
        if: |
          steps.kis_incremental.conclusion == 'failure' &&
          (github.event.schedule == '30 9 * * 1-5' || github.event_name == 'workflow_dispatch')
        run: python collect_supply_demand.py --mode incremental
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
