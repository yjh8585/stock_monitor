name: Vercel Cron - 감성 분석

# Vercel Hobby 플랜은 일 1회 cron만 허용해 vercel.json에서 제외.
# 동일 스케줄로 GitHub Actions가 /api/cron/sentiment 을 Bearer 토큰으로 호출.
# 필요 secret: APP_BASE_URL, CRON_SECRET
on:
  schedule:
    - cron: '15,45 0-7 * * 1-5' # 평일 KST 09:15~16:45 (UTC 0~7시) :15/:45
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: /api/cron/sentiment 호출
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_BASE_URL/CRON_SECRET secret 미설정"
            exit 1
          fi
          curl -sS -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 300 \
            --fail-with-body \
            "$APP_BASE_URL/api/cron/sentiment"
