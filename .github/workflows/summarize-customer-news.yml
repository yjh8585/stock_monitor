name: 고객사 뉴스 주간 요약 (주 1회 · 지난 완결 주)

# 지난 완결 주(KST 월~일) 하나를 회사마다 요약해 사외비 표 customer_news_weekly 에 쌓는다.
# 🔴 --backfill 을 붙이지 말 것 — 소급은 사용자 승인 뒤 로컬 수동(비용 관문 B8).
# 종료 코드 — summarize_customer_news.py 0 정상(검사 실패·empty 포함) · 1 API·DB 오류 · 키 없음 · 2 자가 시험·인자·회사 없음
# 정본 = 스크립트 docstring · docs/commands.md 「고객사 수집 종료 코드」.

on:
  schedule:
    - cron: '0 21 * * 0' # KST 월 06:00 — 지난주(월~일)가 막 닫힌 뒤
  workflow_dispatch:
    inputs:
      company:
        description: '한 회사만(ticker) — 비우면 전체'
        required: false
        default: ''
        type: choice
        options:
          [
            '',
            'GM',
            'RIVN',
            'PII',
            'VFS',
            'STLA',
            'VOW3.DE',
            'P911.DE',
            '005380',
            '000270',
            '012330',
            '003620',
          ]
      weeks:
        description: '지난 완결 주 N개(기본 1)'
        required: false
        default: '1'
        type: string

permissions:
  contents: read

concurrency:
  group: summarize-customer-news
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: scripts
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_REVALIDATE_URL: ${{ secrets.NEXT_REVALIDATE_URL }}
      NEXT_REVALIDATE_SECRET: ${{ secrets.NEXT_REVALIDATE_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Python 3.13 설정
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 뉴스 주간 요약
        run: python summarize_customer_news.py ${{ inputs.company != '' && format('--company "{0}"', inputs.company) || '' }} --weeks "${{ inputs.weeks || '1' }}"
