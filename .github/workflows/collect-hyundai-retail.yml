name: 현대차 미국/유럽 현지(retail) 판매 수집 (매월)

on:
  schedule:
    # 매월 16일 03:00 UTC = KST 12:00.
    # 도매(collect-hyundai-sales 15일)보다 하루 늦게 — 같은 페이지지만 retail 발표 시점이
    # 도매보다 일주일 가량 늦는 경향. 같은 cron으로 묶지 않고 분리해 격리.
    - cron: '0 3 16 * *'
  workflow_dispatch:
    inputs:
      year_from:
        description: 'backfill 시작 연도'
        type: string
        default: '2021'
      year_to:
        description: 'backfill 마지막 연도 (비우면 올해)'
        type: string
        default: ''
      region:
        description: '대상 region (US/EU/all)'
        type: choice
        options: [all, US, EU]
        default: all

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Python 3.13 설정
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: Playwright 브라우저 설치 (chromium만)
        run: python -m playwright install --with-deps chromium

      - name: 현대차 retail 수집
        run: |
          ARGS=""
          if [ -n "${{ inputs.year_from }}" ]; then
            ARGS="$ARGS --year-from ${{ inputs.year_from }}"
          fi
          if [ -n "${{ inputs.year_to }}" ]; then
            ARGS="$ARGS --year-to ${{ inputs.year_to }}"
          fi
          if [ -n "${{ inputs.region }}" ] && [ "${{ inputs.region }}" != "all" ]; then
            ARGS="$ARGS --region ${{ inputs.region }}"
          fi
          python collect_hyundai_retail.py $ARGS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_REVALIDATE_URL: ${{ secrets.NEXT_REVALIDATE_URL }}
          NEXT_REVALIDATE_SECRET: ${{ secrets.NEXT_REVALIDATE_SECRET }}
