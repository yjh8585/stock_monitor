name: 기아 차종별 판매 수집 (매월)

on:
  schedule:
    # 매월 16일 03:00 UTC = KST 12:00. 현대(15일)와 1일 차이로 분산 — IR 갱신 타이밍 유사.
    - cron: '0 3 16 * *'
  workflow_dispatch:
    inputs:
      year_from:
        description: 'backfill 시작 연도'
        type: string
        default: '2021'
      year_to:
        description: 'backfill 마지막 연도 (비우면 올해)'
        type: string
        default: ''
      kind:
        description: '수집 종류 (model/factory/export/all)'
        type: choice
        options: [all, model, factory, export]
        default: all
      reprocess_all:
        description: '모든 연도 강제 재처리 (다운로드 캐시 무시)'
        type: boolean
        default: false

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Python 3.13 설정
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # kia는 worldwide.kia.com /api/investors/business-sales-results JSON +
      # /files/{path} 직접 다운로드 (Playwright APIRequestContext 사용). 브라우저는 필요 없으나
      # 안전상 chromium 설치 (collect_kia_sales.py가 APIRequestContext만 쓰지만 sync_playwright().start() 필요).
      - name: Playwright 브라우저 설치 (chromium만)
        run: python -m playwright install --with-deps chromium

      - name: 기아 판매 수집
        run: |
          ARGS=""
          if [ -n "${{ inputs.year_from }}" ]; then
            ARGS="$ARGS --year-from ${{ inputs.year_from }}"
          fi
          if [ -n "${{ inputs.year_to }}" ]; then
            ARGS="$ARGS --year-to ${{ inputs.year_to }}"
          fi
          if [ -n "${{ inputs.kind }}" ] && [ "${{ inputs.kind }}" != "all" ]; then
            ARGS="$ARGS --kind ${{ inputs.kind }}"
          fi
          if [ "${{ inputs.reprocess_all }}" = "true" ]; then
            ARGS="$ARGS --reprocess-all"
          fi
          python collect_kia_sales.py $ARGS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_REVALIDATE_URL: ${{ secrets.NEXT_REVALIDATE_URL }}
          NEXT_REVALIDATE_SECRET: ${{ secrets.NEXT_REVALIDATE_SECRET }}
