name: 철광석·구리·열연 수집 (KOMIS·조달청·SHFE)

on:
  schedule:
    # 매일 21:00 UTC = KST 06:00.
    # KOMIS는 영업일마다 갱신되므로 daily 호출로 누적 + 누락분 백필을 함께 처리.
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Python 3.13 설정
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: Playwright Chromium 설치
        run: python -m playwright install --with-deps chromium

      - name: STEEL_KR (KOMIS Iron Ore) 수집
        run: python collect_steel_kr.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          NEXT_REVALIDATE_URL: ${{ secrets.NEXT_REVALIDATE_URL }}
          NEXT_REVALIDATE_SECRET: ${{ secrets.NEXT_REVALIDATE_SECRET }}

      # 아래 세 단계는 원자재 화면 상단 「구리·열연 지역 비교」 차트용(2026-11-09).
      # 원천이 서로 달라 한 곳이 막혀도 나머지는 돌도록 !cancelled() — 실패한 단계는 그대로 빨간불로 남는다.
      # always() 와 달리 사용자가 실행을 취소하면 멈춘다.
      - name: COPPER_LME (KOMIS LME 구리) 수집
        if: ${{ !cancelled() }}
        run: python collect_copper_lme.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          NEXT_REVALIDATE_URL: ${{ secrets.NEXT_REVALIDATE_URL }}
          NEXT_REVALIDATE_SECRET: ${{ secrets.NEXT_REVALIDATE_SECRET }}

      - name: COPPER_KR (조달청 구리 판매가) 수집
        if: ${{ !cancelled() }}
        run: python collect_copper_pps.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          NEXT_REVALIDATE_URL: ${{ secrets.NEXT_REVALIDATE_URL }}
          NEXT_REVALIDATE_SECRET: ${{ secrets.NEXT_REVALIDATE_SECRET }}

      - name: HRC_CN (SHFE 열연) 수집
        if: ${{ !cancelled() }}
        run: python collect_shfe_hrc.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          NEXT_REVALIDATE_URL: ${{ secrets.NEXT_REVALIDATE_URL }}
          NEXT_REVALIDATE_SECRET: ${{ secrets.NEXT_REVALIDATE_SECRET }}
