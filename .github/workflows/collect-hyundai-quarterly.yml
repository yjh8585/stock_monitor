name: 현대차 분기 IR 보고서 수집 (매월)

on:
  schedule:
    # 매월 25일 03:00 UTC = KST 12:00. 현대차 분기 실적 발표는 1월말/4월말/7월말/10월말.
    # 매월 1회 실행해도 PDF sha256 캐시로 LLM 호출 비용 0 (변경분만 재호출).
    - cron: '0 3 25 * *'
  workflow_dispatch:
    inputs:
      year_from:
        description: 'backfill 시작 연도'
        type: string
        default: '2021'
      year_to:
        description: 'backfill 마지막 연도 (비우면 올해)'
        type: string
        default: ''
      quarter:
        description: '특정 분기만 (1/2/3/4, 비우면 전체)'
        type: choice
        options: ['', '1', '2', '3', '4']
        default: ''
      reprocess_all:
        description: 'sha256 cache 무시하고 모든 PDF 재처리'
        type: boolean
        default: false

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Python 3.13 설정
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: Playwright 브라우저 설치 (chromium만)
        run: python -m playwright install --with-deps chromium

      - name: 현대차 분기 IR PDF 수집
        run: |
          ARGS=""
          if [ -n "${{ inputs.year_from }}" ]; then
            ARGS="$ARGS --year-from ${{ inputs.year_from }}"
          fi
          if [ -n "${{ inputs.year_to }}" ]; then
            ARGS="$ARGS --year-to ${{ inputs.year_to }}"
          fi
          if [ -n "${{ inputs.quarter }}" ]; then
            ARGS="$ARGS --quarter ${{ inputs.quarter }}"
          fi
          if [ "${{ inputs.reprocess_all }}" = "true" ]; then
            ARGS="$ARGS --reprocess-all"
          fi
          python collect_hyundai_quarterly_earnings.py $ARGS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_REVALIDATE_URL: ${{ secrets.NEXT_REVALIDATE_URL }}
          NEXT_REVALIDATE_SECRET: ${{ secrets.NEXT_REVALIDATE_SECRET }}
